<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 380" preserveAspectRatio="xMidYMax meet" role="img" aria-label="France et Japon">
  <g opacity="0.18" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Rising sun (Japon) derrière le Mont Fuji -->
    <circle cx="1150" cy="168" r="78" fill="#eda99b" opacity="0.55" stroke="none"/>

    <!-- Nuages doux -->
    <g fill="#c9d4ea" stroke="none">
      <path d="M300 70c-18 0-30 12-30 24 0 13 12 22 28 22h70c16 0 28-10 28-22 0-14-14-22-28-20-4-14-18-22-34-18-12 3-20 12-22 22z"/>
      <path d="M980 50c-16 0-26 10-26 21 0 11 10 19 24 19h60c14 0 24-9 24-19 0-12-12-19-24-17-3-12-16-19-30-16-10 3-18 11-20 19z"/>
    </g>

    <!-- Tour Eiffel (France) -->
    <g stroke="#46567a" stroke-width="4">
      <line x1="150" y1="150" x2="150" y2="110"/>
      <path d="M116 340 C138 252 147 208 150 152 C153 208 162 252 184 340"/>
      <path d="M126 340 Q150 300 174 340"/>
      <line x1="131" y1="252" x2="169" y2="252"/>
      <line x1="139" y1="212" x2="161" y2="212"/>
    </g>

    <!-- Immeuble haussmannien (France) -->
    <g stroke="#46567a" stroke-width="3.5" fill="#dbe2f2">
      <rect x="250" y="222" width="120" height="118"/>
      <path d="M244 222 L310 190 L376 222 Z"/>
    </g>
    <g stroke="#46567a" stroke-width="2.5">
      <line x1="278" y1="248" x2="278" y2="330"/>
      <line x1="310" y1="248" x2="310" y2="330"/>
      <line x1="342" y1="248" x2="342" y2="330"/>
    </g>

    <!-- Torii (Japon) -->
    <g stroke="#b0564e" stroke-width="7">
      <line x1="560" y1="200" x2="560" y2="340"/>
      <line x1="640" y1="200" x2="640" y2="340"/>
      <path d="M534 196 Q600 178 666 196"/>
      <line x1="548" y1="226" x2="652" y2="226"/>
    </g>

    <!-- Pagode à cinq étages (Japon) -->
    <g stroke="#b0564e" stroke-width="3" fill="#f2ded9">
      <line x1="770" y1="150" x2="770" y2="138"/>
      <path d="M742 172 L770 150 L798 172 Z"/>
      <path d="M736 210 L770 184 L804 210 Z"/>
      <path d="M730 250 L770 220 L810 250 Z"/>
      <path d="M722 294 L770 258 L818 294 Z"/>
      <path d="M714 340 L770 300 L826 340 Z"/>
    </g>
    <g stroke="#b0564e" stroke-width="3" fill="none">
      <line x1="762" y1="210" x2="762" y2="340"/>
      <line x1="778" y1="210" x2="778" y2="340"/>
    </g>

    <!-- Mont Fuji (Japon) -->
    <g stroke="#46567a" stroke-width="4">
      <path d="M980 340 L1150 150 L1320 340" fill="#dbe2f2"/>
      <path d="M1104 208 L1128 186 L1142 200 L1158 182 L1174 202 L1196 208 L1180 222 L1120 222 Z" fill="#ffffff" stroke="#9fb0d0" stroke-width="2"/>
    </g>

    <!-- Sol -->
    <line x1="0" y1="340" x2="1440" y2="340" stroke="#9fb0d0" stroke-width="2.5"/>

    <!-- Pétales de cerisier (sakura) -->
    <g fill="#e7a7b8" stroke="none" opacity="0.9">
      <path d="M470 120c6-8 16-4 14 4 8-2 12 8 4 12 4 8-6 14-12 8-6 6-16 0-12-8-8-4-4-14 4-12-2-8 6-12 8-4z"/>
      <path d="M870 96c5-7 14-3 12 4 7-2 10 7 3 10 4 7-5 12-10 7-5 5-14 0-10-7-7-3-4-12 3-10-2-7 5-11 7-4z" transform="scale(0.8)"/>
      <path d="M640 90c5-7 14-3 12 4 7-2 10 7 3 10 4 7-5 12-10 7-5 5-14 0-10-7-7-3-4-12 3-10-2-7 5-11 7-4z"/>
      <path d="M1240 110c5-7 14-3 12 4 7-2 10 7 3 10 4 7-5 12-10 7-5 5-14 0-10-7-7-3-4-12 3-10-2-7 5-11 7-4z"/>
    </g>
  </g>
</svg>
